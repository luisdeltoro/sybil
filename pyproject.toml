[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "extract-speech"
version = "0.2.0"
description = "Transcribe and diarize speech from video/audio files using Whisper + pyannote"
requires-python = ">=3.12"
dependencies = [
    "openai-whisper",
    "noisereduce",
    "soundfile",
    "numpy",
    "demucs>=4.0.1",
    "torchcodec>=0.13.0",
    "pyannote.audio>=4.0",
]

[project.scripts]
extract-speech = "extract_speech.transcribe:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/extract_speech"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingImports = true
reportUnusedImport = true
reportUnusedVariable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"
